<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agenda" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#141414" />
  <title>Agenda</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; }
    body { font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif; color: #F5F0E8; background: #141414; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
    input, textarea, select, button { font-family: inherit; }
    input[type="date"], input[type="datetime-local"] { color-scheme: dark; }
    button:active { opacity: 0.72; transform: scale(0.97); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    ::placeholder { color: #555; }
    select option { background: #1C1C1C; }
    .sh-r, .sh-l { pointer-events: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Constants ─────────────────────────────────────────────────────────────────

const PRIORITY_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
const PRIORITY_CONFIG = {
  critical: { label: 'Critical', color: '#FF5C5C', bg: '#FF5C5C22' },
  high:     { label: 'High',     color: '#FF9E4A', bg: '#FF9E4A22' },
  medium:   { label: 'Medium',   color: '#F0D060', bg: '#F0D06022' },
  low:      { label: 'Low',      color: '#6DBF6D', bg: '#6DBF6D22' },
};
const TYPE_CONFIG = {
  reminder:    { label: 'Reminder', icon: '🔔' },
  buy:         { label: 'Buy',      icon: '🛒' },
  appointment: { label: 'Appt',     icon: '📅' },
};
const RECUR_CONFIG = {
  none:        { label: 'None' },
  daily:       { label: 'Daily' },
  weekly:      { label: 'Weekly' },
  fortnightly: { label: 'Fortnightly' },
  monthly:     { label: 'Monthly' },
  yearly:      { label: 'Yearly' },
};

const STORAGE_KEY   = 'agenda-items-v1';
const NOTIF_LOG_KEY = 'agenda-notif-log-v1';
const SETTINGS_KEY  = 'agenda-settings-v1';

// ── Storage ───────────────────────────────────────────────────────────────────

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ── Date helpers ──────────────────────────────────────────────────────────────

function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function dayOf(dateStr) {
  const d = new Date(dateStr);
  return startOfDay(d).getTime();
}

function isOverdue(dateStr) {
  if (!dateStr) return false;
  return dayOf(dateStr) < startOfDay(new Date()).getTime();
}
function isToday(dateStr) {
  if (!dateStr) return false;
  return dayOf(dateStr) === startOfDay(new Date()).getTime();
}
function isDueTomorrow(dateStr) {
  if (!dateStr) return false;
  const tmrw = new Date(); tmrw.setDate(tmrw.getDate() + 1);
  return dayOf(dateStr) === startOfDay(tmrw).getTime();
}

function formatDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const diff = (dayOf(dateStr) - startOfDay(new Date()).getTime()) / 86400000;
  const hasTime = dateStr.includes('T') && dateStr.length > 10;
  const timeStr = hasTime ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
  let label;
  if (diff === 0)       label = 'Today';
  else if (diff === 1)  label = 'Tomorrow';
  else if (diff === -1) label = 'Yesterday';
  else if (diff < 0)    label = `${Math.abs(Math.round(diff))}d ago`;
  else if (diff < 7)    label = d.toLocaleDateString([], { weekday: 'long' });
  else                  label = d.toLocaleDateString([], { day: 'numeric', month: 'short' });
  return timeStr ? `${label} · ${timeStr}` : label;
}

function sortByPriorityDate(items) {
  return [...items].sort((a, b) => {
    const pd = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
    if (pd !== 0) return pd;
    if (!a.dueDate && !b.dueDate) return 0;
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    return new Date(a.dueDate) - new Date(b.dueDate);
  });
}

function getNextDueDate(dueDate, recurrence) {
  if (!dueDate || !recurrence || recurrence === 'none') return null;
  const d = new Date(dueDate);
  switch (recurrence) {
    case 'daily':       d.setDate(d.getDate() + 1);         break;
    case 'weekly':      d.setDate(d.getDate() + 7);         break;
    case 'fortnightly': d.setDate(d.getDate() + 14);        break;
    case 'monthly':     d.setMonth(d.getMonth() + 1);       break;
    case 'yearly':      d.setFullYear(d.getFullYear() + 1); break;
    default: return null;
  }
  const hasTime = dueDate.includes('T') && dueDate.length > 10;
  return hasTime ? d.toISOString().slice(0, 16) : d.toISOString().slice(0, 10);
}

function recurLabel(r) {
  if (!r || r === 'none') return null;
  return RECUR_CONFIG[r]?.label || null;
}

// ── Notifications ─────────────────────────────────────────────────────────────

function canNotify() { return 'Notification' in window; }

async function requestNotifPermission() {
  if (!canNotify()) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied')  return false;
  return (await Notification.requestPermission()) === 'granted';
}

function fireNotification(title, body) {
  if (!canNotify() || Notification.permission !== 'granted') return;
  if (navigator.serviceWorker?.controller) {
    navigator.serviceWorker.controller.postMessage({ type: 'NOTIFY', title, body });
  } else {
    try { new Notification(title, { body, icon: './icon.svg' }); } catch {}
  }
}

// ── SwipeCard ─────────────────────────────────────────────────────────────────

function SwipeCard({ onSwipeRight, onSwipeLeft, rightIcon = '✓', rightColor = '#6DBF6D', children }) {
  const wrapRef  = useRef(null);
  const innerRef = useRef(null);
  const THRESHOLD = 72;

  useEffect(() => {
    const wrap  = wrapRef.current;
    const inner = innerRef.current;
    if (!wrap || !inner) return;

    let startX = 0, startY = 0, dragging = false, curOffset = 0;

    const hr = () => wrap.querySelector('.sh-r');
    const hl = () => wrap.querySelector('.sh-l');

    function snap(to, cb) {
      inner.style.transition = 'transform 0.22s ease';
      inner.style.transform  = `translateX(${to}px)`;
      const _hr = hr(), _hl = hl();
      if (_hr) _hr.style.opacity = '0';
      if (_hl) _hl.style.opacity = '0';
      setTimeout(() => {
        inner.style.transition = 'none';
        inner.style.transform  = 'translateX(0)';
        if (cb) cb();
      }, 230);
    }

    function onTouchStart(e) {
      startX    = e.touches[0].clientX;
      startY    = e.touches[0].clientY;
      dragging  = false;
      curOffset = 0;
      inner.style.transition = 'none';
    }

    function onTouchMove(e) {
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) dragging = true;
        else if (Math.abs(dy) > 8) return;
        else return;
      }
      e.preventDefault();
      curOffset = Math.max(-115, Math.min(115, dx));
      inner.style.transform = `translateX(${curOffset}px)`;
      const _hr = hr(), _hl = hl();
      if (_hr) _hr.style.opacity = curOffset > 0 ? String(Math.min(1, curOffset / THRESHOLD)) : '0';
      if (_hl) _hl.style.opacity = curOffset < 0 ? String(Math.min(1, -curOffset / THRESHOLD)) : '0';
    }

    function onTouchEnd() {
      if (!dragging) return;
      dragging = false;
      if      (curOffset >  THRESHOLD) snap( 160, onSwipeRight);
      else if (curOffset < -THRESHOLD) snap(-160, onSwipeLeft);
      else                             snap(0);
    }

    wrap.addEventListener('touchstart', onTouchStart, { passive: true });
    wrap.addEventListener('touchmove',  onTouchMove,  { passive: false });
    wrap.addEventListener('touchend',   onTouchEnd,   { passive: true });
    return () => {
      wrap.removeEventListener('touchstart', onTouchStart);
      wrap.removeEventListener('touchmove',  onTouchMove);
      wrap.removeEventListener('touchend',   onTouchEnd);
    };
  }, [onSwipeRight, onSwipeLeft]);

  return (
    <div ref={wrapRef} style={{ position: 'relative', borderRadius: 14, overflow: 'hidden' }}>
      <div className="sh-r" style={{ position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'flex-start',padding:'0 22px',background: rightColor+'2A',opacity:0 }}>
        <span style={{ fontSize: 26, fontWeight: 800 }}>{rightIcon}</span>
      </div>
      <div className="sh-l" style={{ position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'flex-end',padding:'0 22px',background:'#FF5C5C2A',opacity:0 }}>
        <span style={{ fontSize: 22 }}>🗑</span>
      </div>
      <div ref={innerRef} style={{ position: 'relative', willChange: 'transform' }}>
        {children}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  const [items,        setItems]        = useState(() => load(STORAGE_KEY, []));
  const [tab,          setTab]          = useState('active');
  const [showForm,     setShowForm]     = useState(false);
  const [editItem,     setEditItem]     = useState(null);
  const [filterType,   setFilterType]   = useState('all');
  const [settings,     setSettings]     = useState(() => load(SETTINGS_KEY, { notifHour: 9, notifEnabled: false }));
  const [notifPerm,    setNotifPerm]    = useState(canNotify() ? Notification.permission : 'unsupported');
  const [showSettings, setShowSettings] = useState(false);
  const [searchQuery,  setSearchQuery]  = useState('');
  const [showSearch,   setShowSearch]   = useState(false);
  const [toast,        setToast]        = useState(null); // { msg, undoItem? }
  const toastTimer   = useRef(null);
  const importRef    = useRef(null);

  useEffect(() => { save(STORAGE_KEY,  items);    }, [items]);
  useEffect(() => { save(SETTINGS_KEY, settings); }, [settings]);

  // Notification check
  const checkNotifications = useCallback(() => {
    if (!settings.notifEnabled || Notification.permission !== 'granted') return;
    if (new Date().getHours() < settings.notifHour) return;
    const log   = load(NOTIF_LOG_KEY, {});
    const today = new Date().toISOString().slice(0, 10);
    let updated = false;
    items.filter(i => !i.completedAt && isDueTomorrow(i.dueDate)).forEach(item => {
      const key = `${item.id}-${today}`;
      if (log[key]) return;
      const rl = recurLabel(item.recurrence);
      fireNotification(
        `${TYPE_CONFIG[item.type].icon} ${item.title}`,
        `Due tomorrow${rl ? ` · Repeats ${item.recurrence}` : ''} · ${PRIORITY_CONFIG[item.priority].label} priority`
      );
      log[key] = true; updated = true;
    });
    if (updated) save(NOTIF_LOG_KEY, log);
  }, [items, settings]);

  useEffect(() => {
    checkNotifications();
    const t = setInterval(checkNotifications, 15 * 60 * 1000);
    return () => clearInterval(t);
  }, [checkNotifications]);

  // Toast
  function showToast(msg, undoItem = null) {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, undoItem });
    toastTimer.current = setTimeout(() => setToast(null), undoItem ? 4500 : 2500);
  }
  function handleUndo() {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    if (toast?.undoItem) {
      setItems(prev => sortByPriorityDate([...prev, toast.undoItem]));
      showToast('Restored ✓');
    } else {
      setToast(null);
    }
  }

  // CRUD
  function saveItem(data) {
    if (editItem) {
      setItems(prev => prev.map(i => i.id === editItem.id ? { ...i, ...data } : i));
      showToast('Saved ✓');
    } else {
      setItems(prev => [...prev, { ...data, id: Date.now().toString(), createdAt: new Date().toISOString() }]);
      showToast('Added ✓');
    }
    setShowForm(false); setEditItem(null);
  }

  function completeItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const completedAt = new Date().toISOString();
    if (item.recurrence && item.recurrence !== 'none' && item.dueDate) {
      const nextDue = getNextDueDate(item.dueDate, item.recurrence);
      const next = { ...item, id: (Date.now() + 1).toString(), dueDate: nextDue, createdAt: completedAt, completedAt: null };
      setItems(prev => [...prev.map(i => i.id === id ? { ...i, completedAt } : i), next]);
      showToast(`Done! Next ${item.recurrence} entry added`);
    } else {
      setItems(prev => prev.map(i => i.id === id ? { ...i, completedAt } : i));
      showToast('Done ✓');
    }
  }

  function restoreItem(id) {
    setItems(prev => prev.map(i => i.id === id ? { ...i, completedAt: null } : i));
    showToast('Restored ✓');
  }

  function deleteItem(id) {
    const item = items.find(i => i.id === id);
    setItems(prev => prev.filter(i => i.id !== id));
    showToast(`Deleted`, item);
  }

  // Export
  function exportData() {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `agenda-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Backup saved ✓');
  }

  // Import
  function handleImportFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported)) throw new Error();
        setItems(imported);
        showToast(`${imported.length} items imported ✓`);
      } catch {
        showToast('Invalid backup file');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // Notifications
  async function handleEnableNotifs() {
    const granted = await requestNotifPermission();
    setNotifPerm(canNotify() ? Notification.permission : 'unsupported');
    if (granted) { setSettings(s => ({ ...s, notifEnabled: true })); showToast('Notifications enabled ✓'); }
    else showToast('Blocked — check Settings › Safari › this site');
  }

  // Derived lists
  const active    = items.filter(i => !i.completedAt);
  const completed = [...items.filter(i => i.completedAt)].sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));

  function applyFilter(arr) {
    return filterType === 'all' ? arr : arr.filter(i => i.type === filterType);
  }

  const q = searchQuery.toLowerCase();
  const searchResults = q
    ? applyFilter(tab === 'active' ? active : completed)
        .filter(i => i.title.toLowerCase().includes(q) || (i.notes || '').toLowerCase().includes(q))
    : null;

  // Active sections (when not searching)
  const overdueItems  = applyFilter(active.filter(i => i.dueDate && isOverdue(i.dueDate)))
                          .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
  const todayItems    = sortByPriorityDate(applyFilter(active.filter(i => isToday(i.dueDate))));
  const upcomingItems = sortByPriorityDate(applyFilter(active.filter(i => !i.dueDate || (!isOverdue(i.dueDate) && !isToday(i.dueDate)))));
  const completedFiltered = applyFilter(completed);

  const hasAnything = tab === 'active' ? active.length > 0 : completed.length > 0;

  function openEdit(item) { setEditItem(item); setShowForm(true); }

  function cardActions(item) {
    return item.completedAt
      ? { onSwipeRight: () => restoreItem(item.id), onSwipeLeft: () => deleteItem(item.id), rightIcon: '↩', rightColor: '#6DBF6D' }
      : { onSwipeRight: () => completeItem(item.id), onSwipeLeft: () => deleteItem(item.id), rightIcon: '✓', rightColor: '#6DBF6D' };
  }

  return (
    <div style={S.root}>

      {/* Toast */}
      {toast && (
        <div style={S.toast}>
          <span>{toast.msg}</span>
          {toast.undoItem && (
            <button style={S.undoBtn} onClick={handleUndo}>UNDO</button>
          )}
        </div>
      )}

      {/* Header */}
      <header style={{ ...S.header, paddingTop: 'max(18px, env(safe-area-inset-top))' }}>
        <div style={S.headerTop}>
          <span style={S.logo}>AGENDA</span>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={{ ...S.iconBtn, color: showSearch ? '#F0D060' : '#888' }}
              onClick={() => { setShowSearch(s => !s); setSearchQuery(''); }}>🔍</button>
            <button style={{ ...S.iconBtn, color: showSettings ? '#F0D060' : '#888' }}
              onClick={() => setShowSettings(s => !s)}>⚙</button>
            <button style={S.addBtn} onClick={() => { setEditItem(null); setShowForm(true); setShowSettings(false); setShowSearch(false); }}>+</button>
          </div>
        </div>

        {/* Search bar */}
        {showSearch && (
          <div style={{ marginBottom: 12 }}>
            <input style={S.searchInput} placeholder="Search items…" autoFocus
              value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
          </div>
        )}

        {/* Settings panel */}
        {showSettings && (
          <div style={S.settingsPanel}>
            <p style={{ ...S.settingsLabel, fontSize: 11, letterSpacing: 1.5, color: '#666', textTransform: 'uppercase', marginBottom: 4 }}>Notifications</p>
            <div style={S.settingsRow}>
              <span style={S.settingsLabel}>
                🔔 Day-before alerts
                {notifPerm === 'unsupported' && <span style={S.settingsHint}> (not supported)</span>}
                {notifPerm === 'denied' && <span style={{ ...S.settingsHint, color: '#FF5C5C' }}> (blocked)</span>}
              </span>
              {notifPerm !== 'unsupported' && (
                settings.notifEnabled && notifPerm === 'granted'
                  ? <button style={S.toggleOn}  onClick={() => setSettings(s => ({ ...s, notifEnabled: false }))}>ON</button>
                  : <button style={S.toggleOff} onClick={handleEnableNotifs}>OFF</button>
              )}
            </div>
            {settings.notifEnabled && notifPerm === 'granted' && (
              <div style={S.settingsRow}>
                <span style={S.settingsLabel}>Alert time</span>
                <select style={S.settingsSelect} value={settings.notifHour}
                  onChange={e => setSettings(s => ({ ...s, notifHour: Number(e.target.value) }))}>
                  {[6,7,8,9,10,11,12].map(h => <option key={h} value={h}>{h}:00 {h < 12 ? 'am' : 'pm'}</option>)}
                </select>
              </div>
            )}
            <div style={{ borderTop: '1px solid #2A2A2A', paddingTop: 12, marginTop: 4 }}>
              <p style={{ ...S.settingsLabel, fontSize: 11, letterSpacing: 1.5, color: '#666', textTransform: 'uppercase', marginBottom: 10 }}>Data</p>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                <button style={S.dataBtn} onClick={exportData}>⬇ Export Backup</button>
                <button style={S.dataBtn} onClick={() => importRef.current?.click()}>⬆ Import Backup</button>
                <input ref={importRef} type="file" accept=".json" style={{ display: 'none' }} onChange={handleImportFile} />
              </div>
              <p style={{ ...S.settingsHint, marginTop: 8 }}>
                Export saves a .json file to your device. Import replaces all current data. Keep a backup before importing.
              </p>
            </div>
          </div>
        )}

        {/* Tabs */}
        <div style={S.tabs}>
          {['active','completed'].map(t => (
            <button key={t} style={{ ...S.tabBtn, ...(tab === t ? S.tabActive : {}) }}
              onClick={() => { setTab(t); setShowSettings(false); setSearchQuery(''); }}>
              {t === 'active' ? `Active · ${active.length}` : `Done · ${completed.length}`}
            </button>
          ))}
        </div>

        {/* Type filter */}
        <div style={S.filters}>
          {['all','reminder','buy','appointment'].map(f => (
            <button key={f}
              style={{ ...S.filterBtn, ...(filterType === f ? S.filterActive : {}) }}
              onClick={() => setFilterType(f)}>
              {f === 'all' ? 'All' : `${TYPE_CONFIG[f].icon} ${TYPE_CONFIG[f].label}`}
            </button>
          ))}
        </div>
      </header>

      {/* Main list */}
      <main style={{ ...S.main, paddingBottom: 'max(80px, calc(60px + env(safe-area-inset-bottom)))' }}>

        {/* Search results */}
        {searchQuery && (
          searchResults.length === 0
            ? <div style={S.empty}>No results for "{searchQuery}"</div>
            : searchResults.map(item => (
                <SwipeCard key={item.id} {...cardActions(item)}>
                  <ItemCard item={item} onComplete={() => completeItem(item.id)}
                    onRestore={() => restoreItem(item.id)}
                    onEdit={() => openEdit(item)}
                    onDelete={() => deleteItem(item.id)} />
                </SwipeCard>
              ))
        )}

        {/* Active tab sections */}
        {!searchQuery && tab === 'active' && (
          <>
            {overdueItems.length > 0 && (
              <>
                <SectionHeader label="OVERDUE" color="#FF5C5C" count={overdueItems.length} />
                {overdueItems.map(item => (
                  <SwipeCard key={item.id} {...cardActions(item)}>
                    <ItemCard item={item} onComplete={() => completeItem(item.id)} onRestore={() => restoreItem(item.id)} onEdit={() => openEdit(item)} onDelete={() => deleteItem(item.id)} />
                  </SwipeCard>
                ))}
              </>
            )}
            {todayItems.length > 0 && (
              <>
                <SectionHeader label="TODAY" color="#F0D060" count={todayItems.length} />
                {todayItems.map(item => (
                  <SwipeCard key={item.id} {...cardActions(item)}>
                    <ItemCard item={item} onComplete={() => completeItem(item.id)} onRestore={() => restoreItem(item.id)} onEdit={() => openEdit(item)} onDelete={() => deleteItem(item.id)} />
                  </SwipeCard>
                ))}
              </>
            )}
            {upcomingItems.length > 0 && (
              <>
                {(overdueItems.length > 0 || todayItems.length > 0) &&
                  <SectionHeader label="UPCOMING" color="#666" count={upcomingItems.length} />}
                {upcomingItems.map(item => (
                  <SwipeCard key={item.id} {...cardActions(item)}>
                    <ItemCard item={item} onComplete={() => completeItem(item.id)} onRestore={() => restoreItem(item.id)} onEdit={() => openEdit(item)} onDelete={() => deleteItem(item.id)} />
                  </SwipeCard>
                ))}
              </>
            )}
            {active.length === 0 && (
              <div style={S.empty}>{'Nothing here yet.\nTap + to add something.'}</div>
            )}
            {active.length > 0 && applyFilter(active).length === 0 && (
              <div style={S.empty}>No {filterType}s in your list yet.</div>
            )}
          </>
        )}

        {/* Completed tab */}
        {!searchQuery && tab === 'completed' && (
          completedFiltered.length === 0
            ? <div style={S.empty}>{completed.length === 0 ? 'Nothing completed yet.' : `No ${filterType}s completed yet.`}</div>
            : completedFiltered.map(item => (
                <SwipeCard key={item.id} {...cardActions(item)}>
                  <ItemCard item={item} onComplete={() => completeItem(item.id)} onRestore={() => restoreItem(item.id)} onEdit={() => openEdit(item)} onDelete={() => deleteItem(item.id)} />
                </SwipeCard>
              ))
        )}

        {/* Swipe hint — only shown when list has items */}
        {hasAnything && !searchQuery && (
          <p style={{ textAlign: 'center', color: '#333', fontSize: 12, marginTop: 8, fontStyle: 'italic' }}>
            Swipe right to complete · swipe left to delete
          </p>
        )}
      </main>

      {/* Form modal */}
      {showForm && (
        <ItemForm initial={editItem} onSave={saveItem}
          onClose={() => { setShowForm(false); setEditItem(null); }} />
      )}
    </div>
  );
}

// ── Section Header ────────────────────────────────────────────────────────────

function SectionHeader({ label, color, count }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '4px 2px' }}>
      <div style={{ width: 3, height: 16, borderRadius: 2, background: color, flexShrink: 0 }} />
      <span style={{ fontSize: 11, fontWeight: 800, letterSpacing: 2, color, textTransform: 'uppercase' }}>
        {label}
      </span>
      <span style={{ fontSize: 11, fontWeight: 700, color: color + '88',
        background: color + '18', borderRadius: 10, padding: '1px 7px' }}>{count}</span>
    </div>
  );
}

// ── Item Card ─────────────────────────────────────────────────────────────────

function ItemCard({ item, onComplete, onRestore, onEdit, onDelete }) {
  const [expanded, setExpanded] = useState(false);
  const pc      = PRIORITY_CONFIG[item.priority];
  const tc      = TYPE_CONFIG[item.type];
  const overdue = !item.completedAt && isOverdue(item.dueDate);
  const tmrw    = !item.completedAt && isDueTomorrow(item.dueDate);
  const todayDue= !item.completedAt && isToday(item.dueDate);
  const dateLabel = item.completedAt ? `Done ${formatDate(item.completedAt)}` : formatDate(item.dueDate);
  const rl = recurLabel(item.recurrence);

  return (
    <div style={{ ...S.card, opacity: item.completedAt ? 0.5 : 1 }}>
      <div style={{ ...S.cardStripe, background: item.completedAt ? '#2E2E2E' : pc.color }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={S.cardMain} onClick={() => setExpanded(e => !e)}>
          <div style={S.cardLeft}>
            <span style={S.typeBadge}>{tc.icon}</span>
            <div style={S.cardContent}>
              <span style={{ ...S.cardTitle,
                textDecoration: item.completedAt ? 'line-through' : 'none',
                color: item.completedAt ? '#4A4A4A' : '#F5F0E8',
              }}>
                {item.title}
              </span>
              <div style={S.cardMeta}>
                <span style={{ ...S.priorityChip,
                  color:      item.completedAt ? '#4A4A4A' : pc.color,
                  background: item.completedAt ? '#222' : pc.bg,
                }}>
                  {pc.label}
                </span>
                {rl && <span style={S.recurChip}>↻ {rl}</span>}
                {dateLabel && (
                  <span style={{ ...S.dateLabel,
                    color:      overdue ? '#FF5C5C' : (tmrw || todayDue) ? '#F0D060' : '#777',
                    fontWeight: (overdue || tmrw || todayDue) ? 700 : 500,
                  }}>
                    {overdue ? '⚠ ' : tmrw ? '⏰ ' : ''}{dateLabel}
                  </span>
                )}
              </div>
            </div>
          </div>
          <span style={S.chevron}>{expanded ? '▲' : '▼'}</span>
        </div>

        {expanded && (
          <div style={S.cardExpanded}>
            {item.notes && <p style={S.notes}>{item.notes}</p>}
            {rl && <p style={S.recurNote}>↻ Repeats {item.recurrence} — completing schedules the next one</p>}
            <div style={S.actions}>
              {!item.completedAt ? (
                <>
                  <button style={S.actionBtn} onClick={onComplete}>✓ Done</button>
                  <button style={S.actionBtn} onClick={onEdit}>Edit</button>
                  <button style={{ ...S.actionBtn, ...S.deleteBtn }} onClick={onDelete}>Delete</button>
                </>
              ) : (
                <>
                  <button style={S.actionBtn} onClick={onRestore}>↩ Restore</button>
                  <button style={{ ...S.actionBtn, ...S.deleteBtn }} onClick={onDelete}>Delete</button>
                </>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Item Form ─────────────────────────────────────────────────────────────────

function ItemForm({ initial, onSave, onClose }) {
  const [title,      setTitle]      = useState(initial?.title      || '');
  const [type,       setType]       = useState(initial?.type       || 'reminder');
  const [priority,   setPriority]   = useState(initial?.priority   || 'medium');
  const [dueDate,    setDueDate]    = useState(initial?.dueDate    || '');
  const [recurrence, setRecurrence] = useState(initial?.recurrence || 'none');
  const [notes,      setNotes]      = useState(initial?.notes      || '');

  function handleSave() {
    if (!title.trim()) return;
    onSave({ title: title.trim(), type, priority, dueDate: dueDate || null, recurrence, notes: notes.trim() });
  }

  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={{ ...S.modal, paddingBottom: 'max(36px, calc(24px + env(safe-area-inset-bottom)))' }}
        onClick={e => e.stopPropagation()}>

        <div style={S.modalHeader}>
          <span style={S.modalTitle}>{initial ? 'Edit Item' : 'New Item'}</span>
          <button style={S.closeBtn} onClick={onClose}>✕</button>
        </div>

        <label style={S.label}>What is it?</label>
        <input style={S.input} placeholder="Enter title…" value={title}
          onChange={e => setTitle(e.target.value)} autoFocus />

        <label style={S.label}>Type</label>
        <div style={S.segGroup}>
          {Object.entries(TYPE_CONFIG).map(([k, v]) => (
            <button key={k} style={{ ...S.segBtn, ...(type === k ? S.segActive : {}) }} onClick={() => setType(k)}>
              {v.icon} {v.label}
            </button>
          ))}
        </div>

        <label style={S.label}>Priority</label>
        <div style={S.segGroup}>
          {Object.entries(PRIORITY_CONFIG).map(([k, v]) => (
            <button key={k}
              style={{ ...S.segBtn, ...(priority === k ? { background: v.bg, borderColor: v.color, color: v.color } : {}) }}
              onClick={() => setPriority(k)}>{v.label}</button>
          ))}
        </div>

        <label style={S.label}>{type === 'appointment' ? 'Date & Time' : 'Due Date'} (optional)</label>
        <input style={S.input} type={type === 'appointment' ? 'datetime-local' : 'date'}
          value={dueDate} onChange={e => setDueDate(e.target.value)} />

        <label style={S.label}>Repeats</label>
        <div style={S.segGroup}>
          {Object.entries(RECUR_CONFIG).map(([k, v]) => (
            <button key={k} style={{ ...S.segBtn, ...(recurrence === k ? S.segActive : {}) }} onClick={() => setRecurrence(k)}>
              {k !== 'none' ? '↻ ' : ''}{v.label}
            </button>
          ))}
        </div>

        {recurrence !== 'none' && !dueDate && (
          <p style={{ fontSize: 13, color: '#FF9E4A', marginTop: 4, fontWeight: 600 }}>
            ⚠ Set a due date so the next occurrence can be calculated
          </p>
        )}

        <label style={S.label}>Notes (optional)</label>
        <textarea style={{ ...S.input, height: 80, resize: 'none' }}
          placeholder="Any extra detail…" value={notes}
          onChange={e => setNotes(e.target.value)} />

        <button style={S.saveBtn} onClick={handleSave}>
          {initial ? 'Save Changes' : 'Add to List'}
        </button>
      </div>
    </div>
  );
}
