<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;

// ── Constants ─────────────────────────────────────────────────────────────────

const PRIORITY_ORDER = {critical:0,high:1,medium:2,low:3};
const PRIORITY_CONFIG = {
  critical:{label:'Critical',color:'#FF5C5C',bg:'#FF5C5C22'},
  high:    {label:'High',    color:'#FF9E4A',bg:'#FF9E4A22'},
  medium:  {label:'Medium',  color:'#F0D060',bg:'#F0D06022'},
  low:     {label:'Low',     color:'#6DBF6D',bg:'#6DBF6D22'},
};
const TYPE_CONFIG = {
  reminder:   {label:'Reminder',icon:'🔔'},
  buy:        {label:'Buy',     icon:'🛒'},
  appointment:{label:'Appt',   icon:'📅'},
};
const RECUR_CONFIG = {
  none:'None',daily:'Daily',weekly:'Weekly',
  fortnightly:'Fortnightly',monthly:'Monthly',yearly:'Yearly',
};
const PROJECT_CATS = {
  signal9:{label:'Signal9',color:'#C084FC',bg:'#C084FC18',icon:'◈'},
  writing:{label:'Writing', color:'#60B8F0',bg:'#60B8F018',icon:'✒'},
  general:{label:'General', color:'#A0A0A0',bg:'#A0A0A018',icon:'◎'},
};
const PROJECT_STATUSES = {
  active:{label:'Active',  color:'#6DBF6D'},
  hold:  {label:'On Hold', color:'#FF9E4A'},
  done:  {label:'Archived',color:'#555'},
};
const PAYMENT_METHODS = {
  business:{label:'Business Card',short:'Business',color:'#60B8F0',bg:'#60B8F018',icon:'💳'},
  living:  {label:'Living Card',  short:'Living',  color:'#6DBF6D',bg:'#6DBF6D18',icon:'💚'},
  cash:    {label:'Cash',         short:'Cash',    color:'#F0D060',bg:'#F0D06018',icon:'💵'},
};
const FX_CURRENCIES = {
  USD:{label:'US Dollar',  symbol:'$',flag:'🇺🇸',color:'#60B8F0',bg:'#60B8F018'},
  JPY:{label:'Japanese Yen',symbol:'¥',flag:'🇯🇵',color:'#FF9E4A',bg:'#FF9E4A18'},
};
const WMO = {
  0:{label:'Clear sky',icon:'☀️'},1:{label:'Mainly clear',icon:'🌤️'},
  2:{label:'Partly cloudy',icon:'⛅️'},3:{label:'Overcast',icon:'☁️'},
  45:{label:'Foggy',icon:'🌫️'},48:{label:'Icy fog',icon:'🌫️'},
  51:{label:'Light drizzle',icon:'🌦️'},53:{label:'Drizzle',icon:'🌦️'},55:{label:'Heavy drizzle',icon:'🌧️'},
  61:{label:'Light rain',icon:'🌧️'},63:{label:'Rain',icon:'🌧️'},65:{label:'Heavy rain',icon:'🌧️'},
  71:{label:'Light snow',icon:'🌨️'},73:{label:'Snow',icon:'❄️'},75:{label:'Heavy snow',icon:'❄️'},
  77:{label:'Snow grains',icon:'🌨️'},80:{label:'Light showers',icon:'🌦️'},81:{label:'Showers',icon:'🌧️'},
  82:{label:'Heavy showers',icon:'⛈️'},85:{label:'Snow showers',icon:'🌨️'},86:{label:'Heavy snow showers',icon:'❄️'},
  95:{label:'Thunderstorm',icon:'⛈️'},96:{label:'Thunderstorm + hail',icon:'⛈️'},99:{label:'Thunderstorm + hail',icon:'⛈️'},
};
function wmo(code){return WMO[code]||{label:'Unknown',icon:'🌡️'}}
function windDir(deg){return['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8]}
function dayName(dateStr,i){if(i===0)return'Today';if(i===1)return'Tomorrow';return new Date(dateStr).toLocaleDateString([],{weekday:'short'})}

const ITEMS_KEY    = 'agenda-items-v1';
const PROJECTS_KEY = 'agenda-projects-v1';
const FUEL_KEY     = 'agenda-fuel-v1';
const FX_KEY       = 'agenda-fx-v1';
const WEATHER_KEY  = 'agenda-weather-v1';
const NOTIF_KEY    = 'agenda-notif-log-v1';
const SETTINGS_KEY = 'agenda-settings-v3';

// ── Storage ───────────────────────────────────────────────────────────────────

function load(key,fb){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fb}catch{return fb}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch{}}

// ── Date helpers ──────────────────────────────────────────────────────────────

function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dayOf(s){return sod(new Date(s)).getTime()}
function isOverdue(s)    {if(!s)return false;return dayOf(s)<sod(new Date()).getTime()}
function isToday(s)      {if(!s)return false;return dayOf(s)===sod(new Date()).getTime()}
function isDueTomorrow(s){if(!s)return false;const t=new Date();t.setDate(t.getDate()+1);return dayOf(s)===sod(t).getTime()}
function todayStr(){return new Date().toISOString().slice(0,10)}

function formatDate(s){
  if(!s)return null;
  const d=new Date(s),diff=(dayOf(s)-sod(new Date()).getTime())/86400000;
  const hasTime=s.includes('T')&&s.length>10;
  const ts=hasTime?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):null;
  let label;
  if(diff===0)label='Today';else if(diff===1)label='Tomorrow';else if(diff===-1)label='Yesterday';
  else if(diff<0)label=`${Math.abs(Math.round(diff))}d ago`;
  else if(diff<7)label=d.toLocaleDateString([],{weekday:'long'});
  else label=d.toLocaleDateString([],{day:'numeric',month:'short'});
  return ts?`${label} · ${ts}`:label;
}

function sortByPriorityDate(arr){
  return[...arr].sort((a,b)=>{
    const pd=PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority];
    if(pd!==0)return pd;
    if(!a.dueDate&&!b.dueDate)return 0;if(!a.dueDate)return 1;if(!b.dueDate)return-1;
    return new Date(a.dueDate)-new Date(b.dueDate);
  });
}

function getNextDue(dueDate,rec){
  if(!dueDate||!rec||rec==='none')return null;
  const d=new Date(dueDate);
  if(rec==='daily')d.setDate(d.getDate()+1);
  else if(rec==='weekly')d.setDate(d.getDate()+7);
  else if(rec==='fortnightly')d.setDate(d.getDate()+14);
  else if(rec==='monthly')d.setMonth(d.getMonth()+1);
  else if(rec==='yearly')d.setFullYear(d.getFullYear()+1);
  const hasTime=dueDate.includes('T')&&dueDate.length>10;
  return hasTime?d.toISOString().slice(0,16):d.toISOString().slice(0,10);
}

function recurLabel(r){if(!r||r==='none')return null;return RECUR_CONFIG[r]||null}
function msUntilHour(h){const now=new Date(),t=new Date();t.setHours(h,0,0,0);if(t<=now)t.setDate(t.getDate()+1);return t.getTime()-now.getTime()}

// ── FY helpers (Australian Jul–Jun) ──────────────────────────────────────────

function getCurrentFY(){const m=new Date().getMonth(),y=new Date().getFullYear();return m>=6?{start:y,end:y+1}:{start:y-1,end:y}}
function fyLabel(fy){return`FY ${fy.start}–${String(fy.end).slice(2)}`}
function inFY(dateStr,fy){const d=new Date(dateStr);return d>=new Date(fy.start,6,1)&&d<=new Date(fy.end,5,30,23,59,59)}
function fuelTotals(entries){
  const t={total:0,litres:0,business:0,living:0,cash:0,count:entries.length};
  entries.forEach(e=>{t.total+=e.cost||0;t.litres+=e.litres||0;
    if(e.paymentMethod==='business')t.business+=e.cost||0;
    else if(e.paymentMethod==='living')t.living+=e.cost||0;
    else if(e.paymentMethod==='cash')t.cash+=e.cost||0;
  });return t;
}
function fmt$(n){return n.toFixed(2)}
function fmtL(n){return n>0?`${n.toFixed(1)} L`:''}

function groupFuelByMonth(entries){
  const g={};
  entries.forEach(e=>{
    const d=new Date(e.date),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!g[key])g[key]={key,label:d.toLocaleDateString([],{month:'long',year:'numeric'}),month:d.toLocaleDateString([],{month:'short'}),entries:[]};
    g[key].entries.push(e);
  });
  return Object.values(g).sort((a,b)=>b.key.localeCompare(a.key));
}

// ── Notifications ─────────────────────────────────────────────────────────────

function canNotify(){return 'Notification' in window}
async function requestNotifPermission(){
  if(!canNotify())return false;
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied')return false;
  return(await Notification.requestPermission())==='granted';
}
function fireNotification(title,body){
  if(!canNotify()||Notification.permission!=='granted')return;
  if(navigator.serviceWorker?.controller)navigator.serviceWorker.controller.postMessage({type:'NOTIFY',title,body});
  else try{new Notification(title,{body,icon:'./icon-192.png'})}catch{}
}

// ── ICS Calendar helper ───────────────────────────────────────────────────────

function toICSDate(dateStr){
  if(!dateStr) return null;
  const hasTime = dateStr.includes('T') && dateStr.length > 10;
  const d = new Date(dateStr);
  const pad = n => String(n).padStart(2,'0');
  if(hasTime){
    // Full datetime
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  } else {
    // All-day date
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  }
}

function addToCalendar({title, dateStr, notes='', allDay=false, durationHours=1}){
  if(!dateStr) return;
  const hasTime = dateStr.includes('T') && dateStr.length > 10;
  const isAllDay = allDay || !hasTime;
  const dtStart = toICSDate(dateStr);
  if(!dtStart) return;

  let dtEnd;
  if(isAllDay){
    // All-day: end is next day
    const d = new Date(dateStr);
    d.setDate(d.getDate() + 1);
    const pad = n => String(n).padStart(2,'0');
    dtEnd = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  } else {
    // Timed: end = start + durationHours
    const d = new Date(dateStr);
    d.setHours(d.getHours() + durationHours);
    const pad = n => String(n).padStart(2,'0');
    dtEnd = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  }

  const uid = `agenda-${Date.now()}@pwa`;
  const now  = new Date();
  const pad  = n => String(n).padStart(2,'0');
  const dtstamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}T${pad(now.getHours())}${pad(now.getMinutes())}00Z`;

  const safeTitle = title.replace(/[,;\\]/g,'\\$&').replace(/\n/g,'\\n');
  const safeNotes = notes.replace(/[,;\\]/g,'\\$&').replace(/\n/g,'\\n');

  const dtProp = isAllDay ? 'DATE' : 'DATE-TIME';

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Agenda PWA//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART;VALUE=${dtProp}:${dtStart}`,
    `DTEND;VALUE=${dtProp}:${dtEnd}`,
    `SUMMARY:${safeTitle}`,
    safeNotes ? `DESCRIPTION:${safeNotes}` : '',
    'BEGIN:VALARM',
    'TRIGGER:-P1D',
    'ACTION:DISPLAY',
    `DESCRIPTION:Reminder: ${safeTitle}`,
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `${title.replace(/[^a-z0-9]/gi,'-').toLowerCase()}.ics`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── SwipeCard ─────────────────────────────────────────────────────────────────

function SwipeCard({onSwipeRight,onSwipeLeft,rightIcon='✓',rightColor='#6DBF6D',children}){
  const wrapRef=useRef(null),innerRef=useRef(null),THRESH=72;
  useEffect(()=>{
    const wrap=wrapRef.current,inner=innerRef.current;if(!wrap||!inner)return;
    let sx=0,sy=0,drag=false,cur=0;
    const hr=()=>wrap.querySelector('.sh-r'),hl=()=>wrap.querySelector('.sh-l');
    function snap(to,cb){inner.style.transition='transform .22s ease';inner.style.transform=`translateX(${to}px)`;const _r=hr(),_l=hl();if(_r)_r.style.opacity='0';if(_l)_l.style.opacity='0';setTimeout(()=>{inner.style.transition='none';inner.style.transform='translateX(0)';if(cb)cb()},230)}
    function ts(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;drag=false;cur=0;inner.style.transition='none'}
    function tm(e){const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(!drag){if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8)drag=true;else if(Math.abs(dy)>8)return;else return}e.preventDefault();cur=Math.max(-115,Math.min(115,dx));inner.style.transform=`translateX(${cur}px)`;const _r=hr(),_l=hl();if(_r)_r.style.opacity=cur>0?String(Math.min(1,cur/THRESH)):'0';if(_l)_l.style.opacity=cur<0?String(Math.min(1,-cur/THRESH)):'0'}
    function te(){if(!drag)return;drag=false;if(cur>THRESH)snap(160,onSwipeRight);else if(cur<-THRESH)snap(-160,onSwipeLeft);else snap(0)}
    wrap.addEventListener('touchstart',ts,{passive:true});wrap.addEventListener('touchmove',tm,{passive:false});wrap.addEventListener('touchend',te,{passive:true});
    return()=>{wrap.removeEventListener('touchstart',ts);wrap.removeEventListener('touchmove',tm);wrap.removeEventListener('touchend',te)};
  },[onSwipeRight,onSwipeLeft]);
  return(
    <div ref={wrapRef} style={{position:'relative',borderRadius:14,overflow:'hidden'}}>
      <div className="sh-r" style={{position:'absolute',inset:0,display:'flex',alignItems:'center',padding:'0 22px',background:rightColor+'2A',opacity:0}}><span style={{fontSize:26,fontWeight:800}}>{rightIcon}</span></div>
      <div className="sh-l" style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'flex-end',padding:'0 22px',background:'#FF5C5C2A',opacity:0}}><span style={{fontSize:22}}>🗑</span></div>
      <div ref={innerRef} style={{position:'relative',willChange:'transform'}}>{children}</div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────

const DEFAULT_SETTINGS={notifHour:9,notifEnabled:false,autoClearDays:30,swipeHintSeen:false,lastPaymentMethod:'business',lastBackupAt:null,backupReminderDismissedAt:null};

function App(){
  const [items,        setItems]       = useState(()=>load(ITEMS_KEY,[]));
  const [projects,     setProjects]    = useState(()=>load(PROJECTS_KEY,[]));
  const [fuel,         setFuel]        = useState(()=>load(FUEL_KEY,[]));
  const [fx,           setFx]          = useState(()=>load(FX_KEY,{rates:{},prev:{},updatedAt:null,error:null}));
  const [weather,      setWeather]     = useState(()=>load(WEATHER_KEY,null));
  const [settings,     setSettings]    = useState(()=>({...DEFAULT_SETTINGS,...load(SETTINGS_KEY,{})}));

  // Navigation state
  const [mainTab,     setMainTab]     = useState('agenda');   // agenda|shopping|projects|trackers|settings
  const [agendaTab,   setAgendaTab]   = useState('active');   // active|done
  const [trackerTab,  setTrackerTab]  = useState('fuel');     // fuel|currency|weather
  const [projFilter,  setProjFilter]  = useState('all');

  // UI state
  const [showForm,    setShowForm]    = useState(false);
  const [showProjForm,setShowProjForm]= useState(false);
  const [showFuelForm,setShowFuelForm]= useState(false);
  const [editItem,    setEditItem]    = useState(null);
  const [editProj,    setEditProj]    = useState(null);
  const [editFuel,    setEditFuel]    = useState(null);
  const [defaultType, setDefaultType] = useState('reminder');
  const [showSearch,  setShowSearch]  = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const [toast,       setToast]       = useState(null);
  const [notifPerm,   setNotifPerm]   = useState(canNotify()?Notification.permission:'unsupported');
  const toastTimer=useRef(null),importRef=useRef(null);

  // ── Persist ──
  useEffect(()=>{save(ITEMS_KEY,items)},[items]);
  useEffect(()=>{save(PROJECTS_KEY,projects)},[projects]);
  useEffect(()=>{save(FUEL_KEY,fuel)},[fuel]);
  useEffect(()=>{save(FX_KEY,fx)},[fx]);
  useEffect(()=>{save(WEATHER_KEY,weather)},[weather]);
  useEffect(()=>{save(SETTINGS_KEY,settings)},[settings]);

  // ── Auto-clear completed ──
  useEffect(()=>{
    if(settings.autoClearDays===0)return;
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-settings.autoClearDays);
    setItems(prev=>{const f=prev.filter(i=>!i.completedAt||new Date(i.completedAt)>cutoff);return f.length===prev.length?prev:f});
  // eslint-disable-next-line
  },[]);

  // ── Notifications ──
  const checkNotifications=useCallback(()=>{
    if(!settings.notifEnabled||Notification.permission!=='granted')return;
    if(new Date().getHours()<settings.notifHour)return;
    const log=load(NOTIF_KEY,{}),today=new Date().toISOString().slice(0,10);
    let updated=false;
    items.filter(i=>!i.completedAt&&isDueTomorrow(i.dueDate)).forEach(item=>{
      const key=`${item.id}-${today}`;if(log[key])return;
      fireNotification(`${TYPE_CONFIG[item.type].icon} ${item.title}`,`Due tomorrow · ${PRIORITY_CONFIG[item.priority].label} priority`);
      log[key]=true;updated=true;
    });
    projects.filter(p=>p.status!=='done'&&isDueTomorrow(p.dueDate)).forEach(p=>{
      const key=`proj-${p.id}-${today}`;if(log[key])return;
      fireNotification(`${PROJECT_CATS[p.category]?.icon||'📁'} ${p.name}`,'Project deadline tomorrow');
      log[key]=true;updated=true;
    });
    if(updated)save(NOTIF_KEY,log);
  },[items,projects,settings]);

  useEffect(()=>{
    checkNotifications();
    const interval=setInterval(checkNotifications,5*60*1000);
    const onVisible=()=>{if(!document.hidden)checkNotifications()};
    document.addEventListener('visibilitychange',onVisible);
    const scheduleNext=()=>{const ms=msUntilHour(settings.notifHour);const t=setTimeout(()=>{checkNotifications();scheduleNext()},ms);return t};
    const scheduled=settings.notifEnabled?scheduleNext():null;
    return()=>{clearInterval(interval);document.removeEventListener('visibilitychange',onVisible);if(scheduled)clearTimeout(scheduled)};
  },[checkNotifications,settings.notifHour,settings.notifEnabled]);

  // ── Toast ──
  function showToast(msg,undo=null){if(toastTimer.current)clearTimeout(toastTimer.current);setToast({msg,undo});toastTimer.current=setTimeout(()=>setToast(null),undo?4500:2500)}
  function handleUndo(){
    if(toastTimer.current)clearTimeout(toastTimer.current);
    if(!toast?.undo){setToast(null);return}
    const{type,payload}=toast.undo;
    if(type==='item'){setItems(prev=>sortByPriorityDate([...prev,payload]));showToast('Restored ✓')}
    else if(type==='project'){setProjects(prev=>[...prev,payload]);showToast('Project restored ✓')}
    else if(type==='fuel'){setFuel(prev=>[...prev,payload].sort((a,b)=>b.date.localeCompare(a.date)));showToast('Entry restored ✓')}
    else setToast(null);
  }

  // ── Item CRUD ──
  function openAdd(type='reminder'){setDefaultType(type);setEditItem(null);setShowForm(true);setShowSearch(false)}
  function openEdit(item){setDefaultType(item.type);setEditItem(item);setShowForm(true)}
  function saveItem(data){
    if(editItem)setItems(prev=>prev.map(i=>i.id===editItem.id?{...i,...data}:i));
    else setItems(prev=>[...prev,{...data,id:Date.now().toString(),createdAt:new Date().toISOString()}]);
    showToast(editItem?'Saved ✓':'Added ✓');setShowForm(false);setEditItem(null);
  }
  function completeItem(id){
    const item=items.find(i=>i.id===id);if(!item)return;
    const completedAt=new Date().toISOString();
    if(item.recurrence&&item.recurrence!=='none'&&item.dueDate){
      const next={...item,id:(Date.now()+1).toString(),dueDate:getNextDue(item.dueDate,item.recurrence),createdAt:completedAt,completedAt:null};
      setItems(prev=>[...prev.map(i=>i.id===id?{...i,completedAt}:i),next]);
      showToast(`Done! Next ${item.recurrence} entry added`);
    }else{setItems(prev=>prev.map(i=>i.id===id?{...i,completedAt}:i));showToast('Done ✓')}
  }
  function completeMultiple(ids){
    const now=new Date().toISOString();const newItems=[];
    setItems(prev=>{
      const updated=prev.map(i=>{
        if(!ids.includes(i.id))return i;
        if(i.recurrence&&i.recurrence!=='none'&&i.dueDate)newItems.push({...i,id:(Date.now()+Math.random()).toString(),dueDate:getNextDue(i.dueDate,i.recurrence),createdAt:now,completedAt:null});
        return{...i,completedAt:now};
      });return[...updated,...newItems];
    });showToast(`${ids.length} item${ids.length>1?'s':''} done ✓`);
  }
  function restoreItem(id){setItems(prev=>prev.map(i=>i.id===id?{...i,completedAt:null}:i));showToast('Restored ✓')}
  function deleteItem(id){const item=items.find(i=>i.id===id);setItems(prev=>prev.filter(i=>i.id!==id));showToast('Deleted',{type:'item',payload:item})}
  function clearAllCompleted(){const n=items.filter(i=>i.completedAt).length;setItems(prev=>prev.filter(i=>!i.completedAt));showToast(`${n} completed item${n!==1?'s':''} cleared`)}

  // ── Project CRUD ──
  function saveProject(data){
    if(editProj)setProjects(prev=>prev.map(p=>p.id===editProj.id?{...p,...data,updatedAt:new Date().toISOString()}:p));
    else setProjects(prev=>[...prev,{...data,id:Date.now().toString(),tasks:[],log:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}]);
    showToast(editProj?'Project saved ✓':'Project created ✓');setShowProjForm(false);setEditProj(null);
  }
  function deleteProject(id){const p=projects.find(x=>x.id===id);setProjects(prev=>prev.filter(x=>x.id!==id));showToast('Project deleted',{type:'project',payload:p})}
  function updateProjectTasks(id,tasks){setProjects(prev=>prev.map(p=>p.id===id?{...p,tasks,updatedAt:new Date().toISOString()}:p))}
  function updateProjectStatus(id,status){setProjects(prev=>prev.map(p=>p.id===id?{...p,status,updatedAt:new Date().toISOString()}:p))}
  function addProjectLog(id,text){const entry={id:Date.now().toString(),text,createdAt:new Date().toISOString()};setProjects(prev=>prev.map(p=>p.id===id?{...p,log:[entry,...(p.log||[])],updatedAt:new Date().toISOString()}:p))}
  function deleteProjectLog(pid,eid){setProjects(prev=>prev.map(p=>p.id===pid?{...p,log:(p.log||[]).filter(e=>e.id!==eid)}:p))}

  // ── Fuel CRUD ──
  function saveFuel(data){
    if(editFuel)setFuel(prev=>[...prev.filter(e=>e.id!==editFuel.id),{...editFuel,...data}].sort((a,b)=>b.date.localeCompare(a.date)));
    else setFuel(prev=>[{...data,id:Date.now().toString(),createdAt:new Date().toISOString()},...prev].sort((a,b)=>b.date.localeCompare(a.date)));
    setSettings(s=>({...s,lastPaymentMethod:data.paymentMethod}));
    showToast(editFuel?'Entry updated ✓':'Fill-up recorded ✓');setShowFuelForm(false);setEditFuel(null);
  }
  function deleteFuel(id){const e=fuel.find(x=>x.id===id);setFuel(prev=>prev.filter(x=>x.id!==id));showToast('Entry deleted',{type:'fuel',payload:e})}

  // ── FX fetch ──
  const fetchRates=useCallback(async(force=false)=>{
    const stored=load(FX_KEY,{rates:{},prev:{},updatedAt:null});
    if(!force&&stored.updatedAt&&(Date.now()-new Date(stored.updatedAt).getTime())/60000<60)return;
    setFx(prev=>({...prev,loading:true,error:null}));
    try{
      let rates={},date='';
      try{
        const res=await fetch('https://api.frankfurter.app/latest?from=AUD&to=USD,JPY');
        if(res.ok){const d=await res.json();rates=d.rates;date=d.date;}else throw 0;
      }catch{
        const res=await fetch('https://latest.currency-api.pages.dev/v1/currencies/aud.json');
        if(!res.ok)throw new Error('Both rate sources failed');
        const d=await res.json();date=d.date||'';rates={USD:d.aud.usd,JPY:d.aud.jpy};
      }
      if(rates.USD)rates.USD=Math.round(rates.USD*10000)/10000;
      if(rates.JPY)rates.JPY=Math.round(rates.JPY*100)/100;
      const next={rates,prev:stored.rates||{},date,updatedAt:new Date().toISOString(),loading:false,error:null};
      setFx(next);save(FX_KEY,next);
    }catch(e){setFx(prev=>({...prev,loading:false,error:'Could not fetch rates — check your connection'}))}
  },[]);
  const fetchRatesRef=useRef(fetchRates);
  useEffect(()=>{fetchRatesRef.current=fetchRates},[fetchRates]);
  useEffect(()=>{if(mainTab==='trackers'&&trackerTab==='currency')fetchRatesRef.current()},[mainTab,trackerTab]);

  // ── Weather fetch ──
  const fetchWeather=useCallback(async(force=false)=>{
    const stored=load(WEATHER_KEY,null);
    if(!force&&stored?.updatedAt&&(Date.now()-new Date(stored.updatedAt).getTime())/60000<30)return;
    setWeather(prev=>({...prev,loading:true,error:null}));
    try{
      const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:10000}));
      const{latitude:lat,longitude:lon}=pos.coords;
      const[wxRes,geoRes]=await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=6`),
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,{headers:{'Accept-Language':'en'}}),
      ]);
      const[wx,geo]=await Promise.all([wxRes.json(),geoRes.json()]);
      const place=geo?.address?.suburb||geo?.address?.town||geo?.address?.city||geo?.address?.county||'Your location';
      const next={current:wx.current,daily:wx.daily,place,state:geo?.address?.state||'',lat,lon,updatedAt:new Date().toISOString(),loading:false,error:null};
      setWeather(next);save(WEATHER_KEY,next);
    }catch(e){
      const msg=e.code===1?'Location access denied — enable in Settings':'Could not fetch weather';
      setWeather(prev=>({...prev,loading:false,error:msg}));
    }
  },[]);
  const fetchWeatherRef=useRef(fetchWeather);
  useEffect(()=>{fetchWeatherRef.current=fetchWeather},[fetchWeather]);
  useEffect(()=>{if(mainTab==='trackers'&&trackerTab==='weather')fetchWeatherRef.current()},[mainTab,trackerTab]);

  // ── Export / Import ──
  function exportData(){
    const blob=new Blob([JSON.stringify({items,projects,fuel},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`agenda-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
    URL.revokeObjectURL(url);
    setSettings(s=>({...s,lastBackupAt:new Date().toISOString()}));
    showToast('Backup saved ✓');
  }
  function handleImportFile(e){
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(Array.isArray(d)){setItems(d);showToast(`${d.length} items imported ✓`)}
        else if(d.items){setItems(d.items);if(d.projects)setProjects(d.projects);if(d.fuel)setFuel(d.fuel);showToast('Backup imported ✓')}
        else throw 0;
      }catch{showToast('Invalid backup file')}
    };
    reader.readAsText(file);e.target.value='';
  }
  async function handleEnableNotifs(){
    const granted=await requestNotifPermission();
    setNotifPerm(canNotify()?Notification.permission:'unsupported');
    if(granted){setSettings(s=>({...s,notifEnabled:true}));showToast('Notifications enabled ✓')}
    else showToast('Blocked — check Settings › Safari › this site');
  }

  // ── Backup reminder ──
  const showBackupReminder=()=>{
    if(!settings.lastBackupAt) return false;
    const daysSince=(Date.now()-new Date(settings.lastBackupAt).getTime())/(1000*60*60*24);
    if(daysSince<30) return false;
    if(settings.backupReminderDismissedAt){
      const daysSinceDismiss=(Date.now()-new Date(settings.backupReminderDismissedAt).getTime())/(1000*60*60*24);
      if(daysSinceDismiss<7) return false;
    }
    return true;
  };
  function dismissBackupReminder(){setSettings(s=>({...s,backupReminderDismissedAt:new Date().toISOString()}))}

  // ── Derived lists ──
  const active=items.filter(i=>!i.completedAt);
  const completed=[...items.filter(i=>i.completedAt)].sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));
  const buyItems=sortByPriorityDate(active.filter(i=>i.type==='buy'));
  const nonBuy=arr=>arr.filter(i=>i.type!=='buy');
  const q=searchQuery.toLowerCase();
  const searchResults=q?(agendaTab==='done'?completed:nonBuy(active)).filter(i=>i.title.toLowerCase().includes(q)||(i.notes||'').toLowerCase().includes(q)):null;
  const overdueItems =nonBuy(active).filter(i=>i.dueDate&&isOverdue(i.dueDate)).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const todayItems   =sortByPriorityDate(nonBuy(active).filter(i=>isToday(i.dueDate)));
  const upcomingItems=sortByPriorityDate(nonBuy(active).filter(i=>!i.dueDate||(!isOverdue(i.dueDate)&&!isToday(i.dueDate))));
  const filteredProjects=projFilter==='all'?projects:projects.filter(p=>p.category===projFilter);
  const activeProjects=[...filteredProjects.filter(p=>p.status!=='done')].sort((a,b)=>{
    const ao=a.dueDate&&isOverdue(a.dueDate)?0:a.dueDate&&isToday(a.dueDate)?1:2;
    const bo=b.dueDate&&isOverdue(b.dueDate)?0:b.dueDate&&isToday(b.dueDate)?1:2;
    if(ao!==bo)return ao-bo;return new Date(b.updatedAt)-new Date(a.updatedAt);
  });
  const archivedProjects=filteredProjects.filter(p=>p.status==='done');

  function cardActions(item){
    return item.completedAt
      ?{onSwipeRight:()=>restoreItem(item.id),onSwipeLeft:()=>deleteItem(item.id),rightIcon:'↩',rightColor:'#6DBF6D'}
      :{onSwipeRight:()=>completeItem(item.id),onSwipeLeft:()=>deleteItem(item.id),rightIcon:'✓',rightColor:'#6DBF6D'};
  }

  // ── Bottom nav ──
  const NAV=[
    {id:'agenda',   icon:'📋', label:'Agenda',   badge:overdueItems.length||null},
    {id:'shopping', icon:'🛒', label:'Shopping',  badge:buyItems.length||null},
    {id:'projects', icon:'📁', label:'Projects',  badge:null},
    {id:'trackers', icon:'📊', label:'Trackers',  badge:null},
    {id:'settings', icon:'⚙️',  label:'Settings',  badge:null},
  ];

  const showPlus = mainTab==='agenda'||mainTab==='shopping'||mainTab==='projects'||mainTab==='trackers';
  const showSearchBtn = mainTab==='agenda';

  function handlePlus(){
    if(mainTab==='agenda')   openAdd('reminder');
    if(mainTab==='shopping') openAdd('buy');
    if(mainTab==='projects'){setEditProj(null);setShowProjForm(true)}
    if(mainTab==='trackers'&&trackerTab==='fuel'){setEditFuel(null);setShowFuelForm(true)}
  }

  // Swipe hint — show once
  const showSwipeHint=!settings.swipeHintSeen&&(mainTab==='agenda'&&agendaTab==='active')&&nonBuy(active).length>0;
  const dismissSwipeHint=()=>setSettings(s=>({...s,swipeHintSeen:true}));

  return(
    <div style={{background:'#141414',minHeight:'100vh',display:'flex',flexDirection:'column',maxWidth:480,margin:'0 auto',position:'relative'}}>

      {/* Toast */}
      {toast&&(
        <div style={S.toast}>
          <span>{toast.msg}</span>
          {toast.undo&&<button style={S.undoBtn} onClick={handleUndo}>UNDO</button>}
        </div>
      )}

      {/* One-time swipe hint */}
      {showSwipeHint&&(
        <div style={S.swipeBanner}>
          <span style={{fontSize:14,fontWeight:600,color:'#C084FC'}}>👆 Swipe right to complete · swipe left to delete</span>
          <button style={S.swipeBannerClose} onClick={dismissSwipeHint}>Got it</button>
        </div>
      )}

      {/* Header */}
      <header style={{...S.header,paddingTop:'max(18px, env(safe-area-inset-top))'}}>
        <div style={S.headerTop}>
          <span style={S.logo}>AGENDA</span>
          <div style={{display:'flex',gap:8}}>
            {showSearchBtn&&(
              <button style={{...S.iconBtn,color:showSearch?'#F0D060':'#888'}} onClick={()=>{setShowSearch(s=>!s);setSearchQuery('')}}>🔍</button>
            )}
            {showPlus&&!(mainTab==='trackers'&&trackerTab!=='fuel')&&(
              <button style={S.addBtn} onClick={handlePlus}>+</button>
            )}
          </div>
        </div>

        {/* Search */}
        {showSearch&&mainTab==='agenda'&&(
          <div style={{marginBottom:12}}>
            <input style={S.searchInput} placeholder="Search…" autoFocus value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}/>
          </div>
        )}

        {/* Agenda sub-tabs */}
        {mainTab==='agenda'&&(
          <div style={S.subTabs}>
            {[{id:'active',label:'Active'},  {id:'done',label:'Done'}].map(t=>(
              <button key={t.id} style={{...S.subTabBtn,...(agendaTab===t.id?S.subTabActive:{})}}
                onClick={()=>{setAgendaTab(t.id);setShowSearch(false);setSearchQuery('')}}>
                {t.label}
                {t.id==='active'&&nonBuy(active).length>0&&<span style={S.subBadge}>{nonBuy(active).length}</span>}
                {t.id==='done'&&completed.length>0&&<span style={S.subBadge}>{completed.length}</span>}
              </button>
            ))}
          </div>
        )}

        {/* Projects filter */}
        {mainTab==='projects'&&(
          <div style={S.filters}>
            {['all',...Object.keys(PROJECT_CATS)].map(f=>(
              <button key={f}
                style={{...S.filterBtn,...(projFilter===f?{...S.filterActive,borderColor:(PROJECT_CATS[f]?.color||'#F0D060')+'66',color:PROJECT_CATS[f]?.color||'#F0D060'}:{})}}
                onClick={()=>setProjFilter(f)}>
                {f==='all'?'All':`${PROJECT_CATS[f].icon} ${PROJECT_CATS[f].label}`}
              </button>
            ))}
          </div>
        )}

        {/* Trackers sub-tabs */}
        {mainTab==='trackers'&&(
          <div style={S.subTabs}>
            {[{id:'fuel',label:'⛽ Fuel'},{id:'currency',label:'💱 Rates'},{id:'weather',label:'🌤 Weather'}].map(t=>(
              <button key={t.id} style={{...S.subTabBtn,...(trackerTab===t.id?S.subTabActive:{})}}
                onClick={()=>setTrackerTab(t.id)}>
                {t.label}
              </button>
            ))}
          </div>
        )}
      </header>

      {/* Main content */}
      <main style={{...S.main,paddingBottom:'max(100px, calc(84px + env(safe-area-inset-bottom)))'}}>

        {/* ── Agenda ── */}
        {mainTab==='agenda'&&(
          <>
            {searchQuery&&(
              searchResults.length===0
                ?<div style={S.empty}>No results for "{searchQuery}"</div>
                :searchResults.map(item=>(
                  <SwipeCard key={item.id} {...cardActions(item)}>
                    <ItemCard item={item} onComplete={()=>completeItem(item.id)} onRestore={()=>restoreItem(item.id)} onEdit={()=>openEdit(item)} onDelete={()=>deleteItem(item.id)}/>
                  </SwipeCard>
                ))
            )}
            {!searchQuery&&agendaTab==='active'&&(
              <>
                {overdueItems.length>0&&<><SectionHeader label="OVERDUE" color="#FF5C5C" count={overdueItems.length}/>
                  {overdueItems.map(item=><SwipeCard key={item.id} {...cardActions(item)}><ItemCard item={item} onComplete={()=>completeItem(item.id)} onRestore={()=>restoreItem(item.id)} onEdit={()=>openEdit(item)} onDelete={()=>deleteItem(item.id)}/></SwipeCard>)}</>}
                {todayItems.length>0&&<><SectionHeader label="TODAY" color="#F0D060" count={todayItems.length}/>
                  {todayItems.map(item=><SwipeCard key={item.id} {...cardActions(item)}><ItemCard item={item} onComplete={()=>completeItem(item.id)} onRestore={()=>restoreItem(item.id)} onEdit={()=>openEdit(item)} onDelete={()=>deleteItem(item.id)}/></SwipeCard>)}</>}
                {upcomingItems.length>0&&<>
                  {(overdueItems.length>0||todayItems.length>0)&&<SectionHeader label="UPCOMING" color="#666" count={upcomingItems.length}/>}
                  {upcomingItems.map(item=><SwipeCard key={item.id} {...cardActions(item)}><ItemCard item={item} onComplete={()=>completeItem(item.id)} onRestore={()=>restoreItem(item.id)} onEdit={()=>openEdit(item)} onDelete={()=>deleteItem(item.id)}/></SwipeCard>)}</>}
                {nonBuy(active).length===0&&<div style={S.empty}>{'Nothing here yet.\nTap + to add something.'}</div>}
              </>
            )}
            {!searchQuery&&agendaTab==='done'&&(
              completed.length===0
                ?<div style={S.empty}>Nothing completed yet.</div>
                :<>{completed.map(item=>(
                  <SwipeCard key={item.id} {...cardActions(item)}>
                    <ItemCard item={item} onComplete={()=>completeItem(item.id)} onRestore={()=>restoreItem(item.id)} onEdit={()=>openEdit(item)} onDelete={()=>deleteItem(item.id)}/>
                  </SwipeCard>
                ))}<p style={S.hint}>Swipe right to restore · swipe left to delete</p></>
            )}
          </>
        )}

        {/* ── Shopping ── */}
        {mainTab==='shopping'&&(
          <ShoppingList items={buyItems} onCompleteMultiple={completeMultiple} onDelete={deleteItem} onEdit={openEdit}/>
        )}

        {/* ── Projects ── */}
        {mainTab==='projects'&&(
          <ProjectsView active={activeProjects} archived={archivedProjects}
            onEdit={p=>{setEditProj(p);setShowProjForm(true)}}
            onDelete={deleteProject}
            onUpdateTasks={(id,tasks)=>updateProjectTasks(id,tasks)}
            onUpdateStatus={(id,status)=>updateProjectStatus(id,status)}
            onAddLog={(id,text)=>addProjectLog(id,text)}
            onDeleteLog={(pid,eid)=>deleteProjectLog(pid,eid)}/>
        )}

        {/* ── Trackers ── */}
        {mainTab==='trackers'&&trackerTab==='fuel'&&(
          <FuelView entries={fuel} onEdit={e=>{setEditFuel(e);setShowFuelForm(true)}} onDelete={deleteFuel}/>
        )}
        {mainTab==='trackers'&&trackerTab==='currency'&&(
          <CurrencyView fx={fx} onRefresh={()=>fetchRatesRef.current(true)}/>
        )}
        {mainTab==='trackers'&&trackerTab==='weather'&&(
          <WeatherView weather={weather} onRefresh={()=>fetchWeatherRef.current(true)}/>
        )}

        {/* ── Settings ── */}
        {mainTab==='settings'&&(
          <SettingsView
            settings={settings} setSettings={setSettings}
            notifPerm={notifPerm} onEnableNotifs={handleEnableNotifs}
            completed={completed} onClearCompleted={clearAllCompleted}
            onExport={exportData} onImport={()=>importRef.current?.click()}
            showBackupReminder={showBackupReminder()} onDismissBackup={dismissBackupReminder}
          />
        )}
      </main>

      {/* Bottom nav */}
      <nav style={{...S.bottomNav,paddingBottom:'max(16px, env(safe-area-inset-bottom))'}}>
        {NAV.map(n=>{
          const active=mainTab===n.id;
          return(
            <button key={n.id} style={{...S.navBtn,...(active?S.navBtnActive:{})}}
              onClick={()=>{setMainTab(n.id);setShowSearch(false);setSearchQuery('')}}>
              <span style={{fontSize:26,lineHeight:1,position:'relative'}}>
                {n.icon}
                {n.badge>0&&(
                  <span style={{
                    position:'absolute',top:-8,right:-10,
                    background:'#FF5C5C',color:'#FFF',
                    borderRadius:10,padding:'1px 5px',
                    fontSize:11,fontWeight:800,lineHeight:1.4,minWidth:18,textAlign:'center',
                  }}>{n.badge}</span>
                )}
              </span>
              <span style={{fontSize:11,fontWeight:700,color:active?'#F0D060':'#555',marginTop:3}}>{n.label}</span>
            </button>
          );
        })}
      </nav>

      {/* Forms */}
      {showForm&&<ItemForm initial={editItem} defaultType={defaultType} onSave={saveItem} onClose={()=>{setShowForm(false);setEditItem(null)}}/>}
      {showProjForm&&<ProjectForm initial={editProj} onSave={saveProject} onClose={()=>{setShowProjForm(false);setEditProj(null)}}/>}
      {showFuelForm&&<FuelForm initial={editFuel} defaultMethod={settings.lastPaymentMethod} onSave={saveFuel} onClose={()=>{setShowFuelForm(false);setEditFuel(null)}}/>}
      <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImportFile}/>
    </div>
  );
}

// ── Settings View ─────────────────────────────────────────────────────────────

function SettingsView({settings,setSettings,notifPerm,onEnableNotifs,completed,onClearCompleted,onExport,onImport,showBackupReminder,onDismissBackup}){
  const daysSinceBackup=settings.lastBackupAt?Math.floor((Date.now()-new Date(settings.lastBackupAt).getTime())/(1000*60*60*24)):null;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>

      {/* Backup reminder banner */}
      {showBackupReminder&&(
        <div style={{background:'#FF9E4A18',border:'2px solid #FF9E4A55',borderRadius:14,padding:'16px'}}>
          <div style={{fontSize:16,fontWeight:800,color:'#FF9E4A',marginBottom:6}}>⚠ Backup reminder</div>
          <div style={{fontSize:14,color:'#AA8060',marginBottom:14,lineHeight:1.5}}>
            {daysSinceBackup} days since your last backup. Export a copy to keep your data safe.
          </div>
          <div style={{display:'flex',gap:10}}>
            <button style={{...S.actionBtn,color:'#FF9E4A',borderColor:'#FF9E4A44',flex:1}} onClick={onExport}>Export Now</button>
            <button style={{...S.actionBtn,flex:1}} onClick={onDismissBackup}>Remind Later</button>
          </div>
        </div>
      )}

      {/* Notifications */}
      <div style={S.settingsCard}>
        <p style={S.sectionLbl}>Notifications</p>
        <div style={S.settingsRow}>
          <span style={S.settingsLabel}>🔔 Day-before alerts
            {notifPerm==='unsupported'&&<span style={S.sHint}> (not supported)</span>}
            {notifPerm==='denied'&&<span style={{...S.sHint,color:'#FF5C5C'}}> (blocked in Settings)</span>}
          </span>
          {notifPerm!=='unsupported'&&(settings.notifEnabled&&notifPerm==='granted'
            ?<button style={S.toggleOn} onClick={()=>setSettings(s=>({...s,notifEnabled:false}))}>ON</button>
            :<button style={S.toggleOff} onClick={onEnableNotifs}>OFF</button>)}
        </div>
        {settings.notifEnabled&&notifPerm==='granted'&&(
          <div style={{...S.settingsRow,marginTop:10}}>
            <span style={S.settingsLabel}>Alert time</span>
            <select style={S.settingsSelect} value={settings.notifHour} onChange={e=>setSettings(s=>({...s,notifHour:Number(e.target.value)}))}>
              {[6,7,8,9,10,11,12].map(h=><option key={h} value={h}>{h}:00 {h<12?'am':'pm'}</option>)}
            </select>
          </div>
        )}
        <p style={{...S.sHint,marginTop:8}}>Checks on app open, on return from background, and every 5 minutes. iOS 16.4+ required for home screen alerts.</p>
      </div>

      {/* Completed items */}
      <div style={S.settingsCard}>
        <p style={S.sectionLbl}>Completed Items</p>
        <div style={S.settingsRow}>
          <span style={S.settingsLabel}>Auto-clear after</span>
          <select style={S.settingsSelect} value={settings.autoClearDays} onChange={e=>setSettings(s=>({...s,autoClearDays:Number(e.target.value)}))}>
            <option value={0}>Never</option>

// ── Fuel Chart ────────────────────────────────────────────────────────────────

function FuelChart({months}){
  const totals=months.map(m=>({label:m.month,total:fuelTotals(m.entries).total}));
  const max=Math.max(...totals.map(t=>t.total),1);
  const W=360,H=110,PAD_L=4,PAD_R=4,PAD_TOP=8,BAR_GAP=6;
  const count=totals.length;
  const barW=(W-PAD_L-PAD_R-(count-1)*BAR_GAP)/count;

  return(
    <div style={{background:'#1C1C1C',borderRadius:14,padding:'16px 16px 12px'}}>
      <div style={{fontSize:12,fontWeight:700,color:'#555',textTransform:'uppercase',letterSpacing:1.5,marginBottom:12}}>Monthly Spend</div>
      <svg viewBox={`0 0 ${W} ${H+24}`} style={{width:'100%',overflow:'visible'}}>
        {totals.map((t,i)=>{
          const x=PAD_L+i*(barW+BAR_GAP);
          const barH=t.total>0?Math.max(4,((t.total/max)*(H-PAD_TOP))):0;
          const y=H-barH;
          const isLast=i===totals.length-1;
          return(
            <g key={t.label}>
              <rect x={x} y={y} width={barW} height={barH} rx={4}
                fill={isLast?'#F0D060':'#3A3A3A'}/>
              {t.total>0&&<text x={x+barW/2} y={y-4} textAnchor="middle" fill={isLast?'#F0D060':'#777'} fontSize="10" fontWeight="700" fontFamily="Outfit,sans-serif">
                ${Math.round(t.total)}
              </text>}
              <text x={x+barW/2} y={H+16} textAnchor="middle" fill="#555" fontSize="11" fontWeight="600" fontFamily="Outfit,sans-serif">
                {t.label}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function CurrencyView({fx,onRefresh}){
  const [loading,setLoading]=useState(false);
  const [audAmount,setAudAmount]=useState('');
  async function handleRefresh(){setLoading(true);await onRefresh();setLoading(false)}
  const rates=fx?.rates||{},prev=fx?.prev||{};
  const hasRates=rates.USD&&rates.JPY;
  const audVal=parseFloat(audAmount)||0;
  function timeSince(iso){if(!iso)return null;const mins=Math.round((Date.now()-new Date(iso).getTime())/60000);if(mins<1)return'just now';if(mins<60)return`${mins}m ago`;const h=Math.floor(mins/60);if(h<24)return`${h}h ago`;return`${Math.floor(h/24)}d ago`}
  function trend(code){const cur=rates[code],prv=prev[code];if(!prv||!cur||prv===cur)return{dir:'—',color:'#555'};return cur>prv?{dir:'▲',color:'#6DBF6D',note:`up from ${code==='JPY'?prv.toFixed(2):prv.toFixed(4)}`}:{dir:'▼',color:'#FF5C5C',note:`down from ${code==='JPY'?prv.toFixed(2):prv.toFixed(4)}`}}
  function fmtConverted(code){const r=rates[code];if(!r||!audVal)return null;const v=audVal*r;return code==='JPY'?`¥${Math.round(v).toLocaleString()}`:`$${v.toFixed(2)}`}
  if(fx?.loading||loading)return<div style={{textAlign:'center',marginTop:80}}><div style={{fontSize:48,marginBottom:16}}>↻</div><div style={{color:'#888',fontSize:16,fontWeight:600}}>Fetching rates…</div></div>;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>

      {fx?.error&&<div style={{background:'#FF5C5C18',border:'1px solid #FF5C5C44',borderRadius:12,padding:'14px 16px',display:'flex',gap:12,alignItems:'center'}}><span style={{fontSize:20}}>⚠️</span><div style={{fontSize:14,color:'#FF9E4A',fontWeight:700}}>{fx.error}</div></div>}
      {!hasRates&&!fx?.error&&<div style={{textAlign:'center',marginTop:40}}><div style={{fontSize:48,marginBottom:16}}>💱</div><div style={{color:'#888',fontSize:16,fontWeight:600,marginBottom:16}}>No rates loaded yet</div><button style={{...S.actionBtn,padding:'14px 28px'}} onClick={handleRefresh}>Fetch Rates</button></div>}
      {hasRates&&Object.entries(FX_CURRENCIES).map(([code,cur])=>{const t=trend(code),rate=rates[code];return(
        <div key={code} style={{background:'#1C1C1C',borderRadius:16,overflow:'hidden',border:`1px solid ${cur.color}22`}}>
          <div style={{background:cur.color+'18',padding:'16px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:`1px solid ${cur.color}22`}}>

            <div style={{textAlign:'right'}}><span style={{fontSize:22,fontWeight:800,color:t.color}}>{t.dir}</span>{t.note&&<div style={{fontSize:11,color:'#555',marginTop:2}}>{t.note}</div>}</div>

            <div style={{textAlign:'center',marginBottom:16}}><div style={{fontSize:12,color:'#555',fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',marginBottom:6}}>1 AUD =</div><div style={{fontSize:44,fontWeight:800,color:cur.color,letterSpacing:-1,lineHeight:1}}>{cur.symbol}{code==='JPY'?rate.toFixed(2):rate.toFixed(4)}</div></div>

function ProjectsView({active,archived,onEdit,onDelete,onUpdateTasks,onUpdateStatus,onAddLog,onDeleteLog}){
  const [showArchived,setShowArchived]=useState(false);
  if(active.length===0&&archived.length===0)return<div style={S.empty}>{'No projects yet.\nTap + to create one.'}</div>;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      {active.map(p=><ProjectCard key={p.id} project={p} onEdit={()=>onEdit(p)} onDelete={()=>onDelete(p.id)} onUpdateTasks={t=>onUpdateTasks(p.id,t)} onUpdateStatus={s=>onUpdateStatus(p.id,s)} onAddLog={t=>onAddLog(p.id,t)} onDeleteLog={eid=>onDeleteLog(p.id,eid)}/>)}
      {archived.length>0&&(
        <>
          <button style={S.archivedToggle} onClick={()=>setShowArchived(s=>!s)}>{showArchived?'▲':'▼'} Archived · {archived.length}</button>
          {showArchived&&archived.map(p=><ProjectCard key={p.id} project={p} onEdit={()=>onEdit(p)} onDelete={()=>onDelete(p.id)} onUpdateTasks={t=>onUpdateTasks(p.id,t)} onUpdateStatus={s=>onUpdateStatus(p.id,s)} onAddLog={t=>onAddLog(p.id,t)} onDeleteLog={eid=>onDeleteLog(p.id,eid)}/>)}

function ProjectCard({project,onEdit,onDelete,onUpdateTasks,onUpdateStatus,onAddLog,onDeleteLog}){
  const [expanded,setExpanded]=useState(false);
  const [newTask,setNewTask]=useState('');
  const [newLog,setNewLog]=useState('');
  const [logTab,setLogTab]=useState('tasks');
  const taskInputRef=useRef(null);
  const cat=PROJECT_CATS[project.category]||PROJECT_CATS.general;
  const status=PROJECT_STATUSES[project.status]||PROJECT_STATUSES.active;
  const tasks=project.tasks||[],log=project.log||[];
  const done=tasks.filter(t=>t.done).length,pct=tasks.length>0?Math.round((done/tasks.length)*100):0;
  const archived=project.status==='done';
  const deadlineOverdue=project.dueDate&&isOverdue(project.dueDate)&&!archived;
  const deadlineToday=project.dueDate&&isToday(project.dueDate)&&!archived;
  function toggleTask(id){onUpdateTasks(tasks.map(t=>t.id===id?{...t,done:!t.done}:t))}
  function addTask(){if(!newTask.trim())return;onUpdateTasks([...tasks,{id:Date.now().toString(),text:newTask.trim(),done:false}]);setNewTask('');taskInputRef.current?.focus()}
  function deleteTask(id){onUpdateTasks(tasks.filter(t=>t.id!==id))}
  function submitLog(){if(!newLog.trim())return;onAddLog(newLog.trim());setNewLog('')}
  return(
    <div style={{...S.projCard,opacity:archived?.6:1,outline:deadlineOverdue?'2px solid #FF5C5C33':deadlineToday?'2px solid #F0D06033':'none'}}>
      <div style={{...S.cardStripe,background:archived?'#2E2E2E':deadlineOverdue?'#FF5C5C':deadlineToday?'#F0D060':cat.color}}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,paddingRight:14,cursor:'pointer'}} onClick={()=>setExpanded(e=>!e)}>
          <div style={{flex:1,minWidth:0}}>
            <span style={{display:'block',fontSize:19,fontWeight:800,color:archived?'#555':'#F5F0E8',marginBottom:7,wordBreak:'break-word'}}>{project.name}</span>
            <div style={{display:'flex',gap:7,flexWrap:'wrap',alignItems:'center'}}>
              <span style={{fontSize:12,fontWeight:700,color:archived?'#444':cat.color,background:archived?'#222':cat.bg,borderRadius:6,padding:'3px 9px'}}>{cat.icon} {cat.label}</span>
              <span style={{fontSize:12,fontWeight:700,color:status.color,background:status.color+'18',borderRadius:6,padding:'3px 9px'}}>{status.label}</span>
              {tasks.length>0&&<span style={{fontSize:12,color:'#666',fontWeight:600}}>{done}/{tasks.length} tasks</span>}
              {log.length>0&&<span style={{fontSize:12,color:'#555',fontWeight:600}}>📝 {log.length}</span>}
              {project.dueDate&&<span style={{fontSize:12,fontWeight:700,color:deadlineOverdue?'#FF5C5C':deadlineToday?'#F0D060':'#888'}}>{deadlineOverdue?'⚠ ':deadlineToday?'⏰ ':'📅 '}{formatDate(project.dueDate)}</span>}
            </div>
          </div>
          <span style={{color:'#444',fontSize:13,flexShrink:0,marginTop:4}}>{expanded?'▲':'▼'}</span>
        </div>
        {tasks.length>0&&<div style={{height:4,background:'#252525',borderRadius:2,margin:'12px 14px 0 0',overflow:'hidden'}}><div style={{height:'100%',width:`${pct}%`,background:pct===100?'#6DBF6D':cat.color,borderRadius:2,transition:'width .3s'}}/></div>}
        {expanded&&(
          <div style={{marginTop:14,borderTop:'1px solid #242424',paddingTop:14,paddingRight:14}}>
            {project.description&&<p style={{fontSize:15,color:'#9A9080',lineHeight:1.6,marginBottom:14,fontWeight:500}}>{project.description}</p>}
            <div style={{display:'flex',gap:4,marginBottom:14}}>
              {['tasks','log'].map(t=>(
                <button key={t} style={{...S.miniTab,...(logTab===t?S.miniTabActive:{})}} onClick={()=>setLogTab(t)}>
                  {t==='tasks'?`Tasks (${tasks.length})`:`Notes Log (${log.length})`}
                </button>
              ))}
            </div>
            {logTab==='tasks'&&(
              <>
                {tasks.length>0&&<div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:12}}>
                  {tasks.map(task=>(
                    <div key={task.id} style={{display:'flex',alignItems:'center',gap:10}}>
                      <div style={{...S.checkbox,width:34,height:34,flexShrink:0,background:task.done?'#6DBF6D':'transparent',borderColor:task.done?'#6DBF6D':'#3A3A3A'}} onClick={()=>toggleTask(task.id)}>
                        {task.done&&<span style={{color:'#141414',fontSize:16,fontWeight:900}}>✓</span>}
                      </div>
                      <span style={{flex:1,fontSize:17,fontWeight:600,color:task.done?'#444':'#DDD',textDecoration:task.done?'line-through':'none',wordBreak:'break-word'}}>{task.text}</span>
                      <button style={{background:'transparent',border:'none',color:'#444',fontSize:20,cursor:'pointer',padding:'4px 10px',flexShrink:0}} onClick={()=>deleteTask(task.id)}>✕</button>
                    </div>
                  ))}
                </div>}
                {!archived&&<div style={{display:'flex',gap:8,marginBottom:14}}>
                  <input ref={taskInputRef} style={{...S.input,flex:1,padding:'10px 14px',fontSize:15}} placeholder="Add a task…" value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addTask()}}/>
                  <button style={{...S.actionBtn,padding:'10px 18px',fontSize:18,flexShrink:0}} onClick={addTask}>+</button>
                </div>}
                {tasks.length===0&&archived&&<p style={{color:'#444',fontSize:14,marginBottom:14}}>No tasks recorded.</p>}
              </>
            )}
            {logTab==='log'&&(
              <>
                {!archived&&<div style={{display:'flex',gap:8,marginBottom:12}}>
                  <textarea style={{...S.input,flex:1,padding:'10px 14px',fontSize:15,height:72,resize:'none'}} placeholder="Add a note or update…" value={newLog} onChange={e=>setNewLog(e.target.value)}/>
                  <button style={{...S.actionBtn,padding:'10px 16px',fontSize:15,flexShrink:0,alignSelf:'flex-end'}} onClick={submitLog}>Add</button>
                </div>}
                {log.length===0?<p style={{color:'#444',fontSize:14,marginBottom:14}}>No notes yet.</p>:
                <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:14}}>
                  {log.map(entry=>(
                    <div key={entry.id} style={{background:'#1A1A1A',borderRadius:10,padding:'10px 12px'}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
                        <span style={{fontSize:11,color:'#555',fontWeight:600}}>{new Date(entry.createdAt).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})} · {new Date(entry.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
                        {!archived&&<button style={{background:'transparent',border:'none',color:'#444',fontSize:18,cursor:'pointer',padding:'2px 8px'}} onClick={()=>onDeleteLog(entry.id)}>✕</button>}
                      </div>
                      <p style={{fontSize:15,color:'#C0B89A',lineHeight:1.55,fontWeight:500}}>{entry.text}</p>
                    </div>
                  ))}
                </div>}
              </>
            )}
            <div style={{display:'flex',gap:8,flexWrap:'wrap',borderTop:'1px solid #242424',paddingTop:12}}>
              {!archived&&<button style={S.actionBtn} onClick={onEdit}>Edit Project</button>}
              {project.status==='active'&&<button style={{...S.actionBtn,color:'#FF9E4A',borderColor:'#FF9E4A33'}} onClick={()=>onUpdateStatus('hold')}>Pause</button>}
              {project.status==='hold'&&<button style={{...S.actionBtn,color:'#6DBF6D',borderColor:'#6DBF6D33'}} onClick={()=>onUpdateStatus('active')}>Resume</button>}
              {project.status!=='done'&&<button style={{...S.actionBtn,color:'#888',borderColor:'#88888833'}} onClick={()=>onUpdateStatus('done')}>Archive</button>}
              {project.status==='done'&&<button style={{...S.actionBtn,color:'#6DBF6D',borderColor:'#6DBF6D33'}} onClick={()=>onUpdateStatus('active')}>Restore</button>}
              {project.dueDate&&project.status!=='done'&&(
                <button
                  style={{...S.actionBtn,color:'#6DBF6D',borderColor:'#6DBF6D33'}}
                  onClick={()=>addToCalendar({
                    title:`📁 ${project.name} — Deadline`,
                    dateStr: project.dueDate,
                    notes: project.description||'',
                    allDay: true,
                  })}>
                  📅 Add Deadline to Calendar
                </button>
              )}
              <button style={{...S.actionBtn,...S.deleteBtn}} onClick={onDelete}>Delete</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

  const [description,setDescription]=useState(initial?.description||'');

          {Object.entries(PROJECT_CATS).map(([k,v])=>(

        <div style={S.segGroup}>

      </div>
    </div>
  );
}

// ── Shopping List ─────────────────────────────────────────────────────────────

function ShoppingList({items,onCompleteMultiple,onDelete,onEdit}){
  const [checked,setChecked]=useState(new Set());
  function toggle(id){setChecked(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n})}
  function clearChecked(){onCompleteMultiple([...checked]);setChecked(new Set())}
  const pending=items.filter(i=>!checked.has(i.id)),inBasket=items.filter(i=>checked.has(i.id));
  if(items.length===0)return<div style={{...S.empty,marginTop:80}}>{'Your shopping list is empty.\nTap + to add items.'}</div>;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {pending.map(item=>(
        <SwipeCard key={item.id} onSwipeRight={()=>toggle(item.id)} onSwipeLeft={()=>onDelete(item.id)} rightIcon="✓" rightColor="#6DBF6D">
          <ShopRow item={item} checked={false} onToggle={()=>toggle(item.id)} onEdit={()=>onEdit(item)}/>
        </SwipeCard>
      ))}
      {inBasket.length>0&&(
        <>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 4px 6px'}}>
            <span style={{fontSize:13,fontWeight:800,letterSpacing:1.5,color:'#555',textTransform:'uppercase'}}>In basket · {inBasket.length}</span>
            <button style={S.doneShoppingBtn} onClick={clearChecked}>Done Shopping ✓</button>
          </div>
          {inBasket.map(item=>(
            <SwipeCard key={item.id} onSwipeRight={()=>toggle(item.id)} onSwipeLeft={()=>onDelete(item.id)} rightIcon="↩" rightColor="#888">
              <ShopRow item={item} checked={true} onToggle={()=>toggle(item.id)} onEdit={()=>onEdit(item)}/>
            </SwipeCard>
          ))}
        </>
      )}
      <p style={{...S.hint,marginTop:4}}>Tap to add to basket · swipe left to delete</p>
    </div>
  );
}

function ItemForm({initial,defaultType,onSave,onClose}){
  const [title,setTitle]=useState(initial?.title||'');
  const [type,setType]=useState(initial?.type||defaultType||'reminder');
  const [priority,setPriority]=useState(initial?.priority||'medium');
  const [dueDate,setDueDate]=useState(initial?.dueDate||'');
  const [recurrence,setRecurrence]=useState(initial?.recurrence||'none');
  const [notes,setNotes]=useState(initial?.notes||'');
  function handleSave(){if(!title.trim())return;onSave({title:title.trim(),type,priority,dueDate:dueDate||null,recurrence,notes:notes.trim()})}
  return(
    <div style={S.overlay} onClick={onClose}>
      <div style={{...S.modal,paddingBottom:'max(36px,calc(24px + env(safe-area-inset-bottom)))'}} onClick={e=>e.stopPropagation()}>
        <div style={S.modalHeader}><span style={S.modalTitle}>{initial?'Edit Item':'New Item'}</span><button style={S.closeBtn} onClick={onClose}>✕</button></div>
        <label style={S.label}>What is it?</label>
        <input style={S.input} placeholder="Enter title…" value={title} onChange={e=>setTitle(e.target.value)} autoFocus/>
        <label style={S.label}>Type</label>
        <div style={S.segGroup}>
          {Object.entries(TYPE_CONFIG).map(([k,v])=>(
            <button key={k} style={{...S.segBtn,...(type===k?S.segActive:{})}} onClick={()=>setType(k)}>{v.icon} {v.label}</button>
          ))}
        </div>
        <label style={S.label}>Priority</label>
        <div style={S.segGroup}>
          {Object.entries(PRIORITY_CONFIG).map(([k,v])=>(
            <button key={k} style={{...S.segBtn,...(priority===k?{background:v.bg,borderColor:v.color,color:v.color}:{})}} onClick={()=>setPriority(k)}>{v.label}</button>
          ))}
        </div>
        <label style={S.label}>{type==='appointment'?'Date & Time':'Due Date'} (optional)</label>
        <input style={S.input} type={type==='appointment'?'datetime-local':'date'} value={dueDate} onChange={e=>setDueDate(e.target.value)}/>
        <label style={S.label}>Repeats</label>
        <div style={S.segGroup}>
          {Object.entries(RECUR_CONFIG).map(([k,v])=>(
            <button key={k} style={{...S.segBtn,...(recurrence===k?S.segActive:{})}} onClick={()=>setRecurrence(k)}>{k!=='none'?'↻ ':''}{v}</button>
          ))}
        </div>
        {recurrence!=='none'&&!dueDate&&<p style={{fontSize:13,color:'#FF9E4A',marginTop:4,fontWeight:600}}>⚠ Set a due date so the next occurrence can be calculated</p>}
        <label style={S.label}>Notes (optional)</label>
        <textarea style={{...S.input,height:80,resize:'none'}} placeholder="Any extra detail…" value={notes} onChange={e=>setNotes(e.target.value)}/>
        <button style={S.saveBtn} onClick={handleSave}>{initial?'Save Changes':'Add to List'}</button>
      </div>
    </div>
  );
}
